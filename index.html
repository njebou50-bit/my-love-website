<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f4">
  <title>A little question for you</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #422d3c;
      --pink: #e95d83;
      --pink-dark: #d74970;
      --cream: #fff6f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 18% 15%, #ffe5ec 0, transparent 35%),
        radial-gradient(ellipse at 85% 85%, #ffe6d9 0, transparent 34%), var(--cream);
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", Avenir, system-ui, sans-serif;
    }

    .card {
      width: min(90vw, 510px);
      min-height: 420px;
      padding: 52px 30px 42px;
      text-align: center;
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(233, 93, 131, .14);
      border-radius: 30px;
      box-shadow: 0 24px 80px rgba(128, 65, 88, .12);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(8px);
    }

    .heart {
      font-size: 52px;
      line-height: 1;
      filter: drop-shadow(0 5px 8px #e95d8333);
      animation: bob 2.2s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 2.8rem);
      line-height: 1.12;
      letter-spacing: -.04em;
      margin: 22px 0 12px;
    }

    .sub {
      margin: 0;
      color: #866e7c;
      font-size: 1.05rem;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 38px;
      min-height: 58px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 15px 29px;
      font: 700 1rem inherit;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .18s, box-shadow .18s, background .18s;
    }

    button:focus-visible {
      outline: 3px solid #8d4972;
      outline-offset: 4px;
    }

    #yes {
      color: white;
      background: var(--pink);
      box-shadow: 0 8px 20px #e95d8340;
    }

    #yes:hover {
      background: var(--pink-dark);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 11px 25px #e95d8355;
    }

    #no {
      color: #806d79;
      background: #f4edf0;
      position: relative;
    }

    #no:hover {
      background: #eee3e8;
    }

    .hint {
      min-height: 1.4em;
      margin: 18px 0 0;
      font-size: .88rem;
      color: #a28796;
    }

    .success {
      display: none;
    }

    .card.accepted .question {
      display: none;
    }

    .card.accepted .success {
      display: block;
      animation: appear .5s ease both;
    }

    .success h1 {
      color: var(--pink-dark);
    }

    .success p {
      color: #806d79;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .sparkle {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      animation: float 7s ease-in-out infinite;
      opacity: .7;
    }

    .s1 {
      left: 10%;
      top: 17%;
      font-size: 25px;
    }

    .s2 {
      right: 12%;
      top: 22%;
      font-size: 19px;
      animation-delay: -2s;
    }

    .s3 {
      left: 15%;
      bottom: 16%;
      font-size: 18px;
      animation-delay: -4s;
    }

    .s4 {
      right: 9%;
      bottom: 14%;
      font-size: 27px;
      animation-delay: -1s;
    }

    .confetti {
      position: fixed;
      top: -20px;
      z-index: 5;
      pointer-events: none;
      animation: fall 2.8s ease-in forwards;
    }

    @keyframes bob {
      50% {
        transform: translateY(-7px) rotate(4deg);
      }
    }

    @keyframes float {
      50% {
        transform: translateY(-14px) rotate(12deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fall {
      to {
        transform: translate(var(--drift), 110vh) rotate(620deg);
        opacity: .1;
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 44px 22px 34px;
        min-height: 390px;
      }

      .buttons {
        gap: 10px;
      }

      button {
        padding: 14px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <span class="sparkle s1" aria-hidden="true">✦</span><span class="sparkle s2" aria-hidden="true">♡</span>
  <span class="sparkle s3" aria-hidden="true">✧</span><span class="sparkle s4" aria-hidden="true">♡</span>
  <main class="card" id="card">
    <section class="question" aria-labelledby="question-title">
      <div class="heart" aria-hidden="true">💌</div>
      <h1 id="question-title">Will you be my girlfriend?</h1>
      <p class="sub">I have a tiny question for you…</p>
      <div class="buttons">
        <button id="yes" type="button">Yes! 💖</button>
        <button id="no" type="button" aria-label="No (try to catch me)">No</button>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </section>
    <section class="success" aria-live="polite">
      <div class="heart" aria-hidden="true">🥰</div>
      <h1>Yay! You just made me so happy! 💕</h1>
      <p>I can’t wait for all the little adventures and happy moments together.</p>
    </section>
  </main>
  <script>
    const card = document.querySelector('#card');
    const noButton = document.querySelector('#no');
    const hint = document.querySelector('#hint');
    let dodges = 0;

    function dodge() {
      dodges++;
      const padding = 18;
      const rect = noButton.getBoundingClientRect();
      const maxX = Math.max(padding, window.innerWidth - rect.width - padding);
      const maxY = Math.max(padding, window.innerHeight - rect.height - padding);
      const x = padding + Math.random() * (maxX - padding);
      const y = padding + Math.random() * (maxY - padding);
      noButton.style.position = 'fixed';
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
      noButton.style.zIndex = '4';
      hint.textContent = ['Hehe, too slow! 😋', 'Oops, that button got shy!', 'Maybe try the pink one? 💗', 'You almost had it!'][Math.min(dodges - 1, 3)];
    }

    noButton.addEventListener('pointerenter', dodge);
    noButton.addEventListener('pointerdown', (event) => { event.preventDefault(); dodge(); });
    noButton.addEventListener('click', dodge);

    document.querySelector('#yes').addEventListener('click', () => {
      card.classList.add('accepted');
      noButton.remove();
      document.querySelectorAll('.sparkle').forEach((el) => el.remove());
      const bits = ['💖', '💕', '✨', '💗', '💘', '🌸'];
      for (let i = 0; i < 34; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.textContent = bits[Math.floor(Math.random() * bits.length)];
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.fontSize = `${14 + Math.random() * 16}px`;
        piece.style.setProperty('--drift', `${Math.random() * 180 - 90}px`);
        piece.style.animationDelay = `${Math.random() * .8}s`;
        document.body.append(piece);
        piece.addEventListener('animationend', () => piece.remove());
      }
    });
  </script>
</body>

</html>
